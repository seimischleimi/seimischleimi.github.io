<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    
    <title>Simon's Homepage</title>
    <style>
        body {font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #000000; color: #ffffff;}
        h1 {color: #0066cc; margin-bottom: 40px;}
        .section-box {background-color: #111111; padding: 20px; margin: 20px auto; max-width: 800px; border-radius: 8px; border: 1px solid #222222;}
        .profil-bild {width: 100%; max-width: 600px; height: auto;}
        .profil-video {width: 100%; max-width: 800px; height: auto;}
        
        /* Stylischer Button für den YouTube-Link - währe schön wenn du denk gelassen hättest*/
        .geheim-button {
            display: inline-block;
            background-color: #222222;
            color: #ff3366;
            padding: 10px 20px;
            margin-bottom: 30px;
            border: 1px solid #ff3366;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .geheim-button:hover
        {
            background-color: #ff3366;
            color: #ffffff;
            box-shadow: 0 0 10px #ff3366;
        }
    </style>
    
</head>
<body>

    <h1>Welcome to the page of Simon Binkert</h1>

    <!-- Der "Geheim-Link" als Button -->
    <a href="https://vimeo.com/1219600085" target="_blank" class="geheim-button">do not click me!</a>
    
    <!-- Bild-Bereich -->
    <div class="section-box">
        <img src="mein-foto.jpg" alt="Photo of Simon Binkert" class="profil-bild">
        <br>
        <a href="mein-foto.jpg" target="_blank" style="color: #0066cc; font-size: 14px; display: inline-block; margin-top: 10px;">Bild in Originalgröße öffnen</a>
    </div>

    <!-- Lokales Video (Das funktionierende Video) -->
    <div class="section-box">
        <video controls class="profil-video">
            <source src="mein-video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <style>
        .rahmen-link
        {
            display: inline-block;
            text-decoration: none;
        }
    
        .rahmen-bild
        {
            border: 4px solid #000000; /* Viereckiger, schwarzer Rahmen */
            border-radius: 0 !important; /* Erzwingt absolut spitze Ecken */
            display: block;
            max-width: 100%;
            height: auto;
        }
    </style>
    
    <a href="https://www.youtube.com/watch?v=z_jjUM2NK5M&list=RDz_jjUM2NK5M&start_radio=1" class="rahmen-link" target="_blank">
      <img src="bild.jpg" alt="Love is for loosers!" class="rahmen-bild">
    </a>
    
<div class="section-box">
    <a href="https://www.youtube.com/watch?v=snO68aJTOpM" target="_blank" class="geheim-button">do not click me!</a>
    </a> <!-- <-- DIESES TAG IST ZU VIEL UND ERZEUGT DEN FEHLER -->
</div>


</body>
</html>
